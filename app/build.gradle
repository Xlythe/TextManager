apply plugin: 'com.android.application'

repositories {
    maven {
        url "https://s3.amazonaws.com/repo.commonsware.com"
    }
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.xlythe.sms"
        minSdk 24
        targetSdk 37
        versionCode 15
        versionName "2.1.3"
        vectorDrawables.useSupportLibrary = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { maxHeapSize = "3g" }
    }
    lint {
        abortOnError false
    }
    namespace 'com.xlythe.sms'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation project(':android-text-manager')
    implementation 'com.github.bumptech.glide:glide:5.0.10'
    implementation 'org.lucasr.twowayview:twowayview:0.1.4'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.xlythe:sticky-headers-recyclerview:0.4.3'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'com.xlythe:swap:1.1'
    implementation 'com.xlythe:camera-view:2.0.8'
    implementation 'com.xlythe:message-based-notifications:2.0.0'
    implementation 'com.google.guava:guava:33.8.0-android'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.robolectric:robolectric:4.18.1"
}

configurations.all {
    exclude group: 'com.android.support'
    exclude group: 'com.google.guava', module: 'listenablefuture'
}
