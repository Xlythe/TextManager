apply plugin: 'com.android.application'

repositories {
    maven {
        url "https://s3.amazonaws.com/repo.commonsware.com"
    }
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.xlythe.sms"
        minSdk 21
        targetSdk 37
        versionCode 14
        versionName "2.1.2"
        vectorDrawables.useSupportLibrary = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    lint {
        abortOnError false
    }
    namespace 'com.xlythe.sms'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation('androidx.appcompat:appcompat:1.7.1') {
        version { strictly '1.7.1' }
    }
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation project(':android-text-manager')
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation 'org.lucasr.twowayview:twowayview:0.1.4'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'de.hdodenhof:circleimageview:2.0.0'
    implementation 'com.xlythe:sticky-headers-recyclerview:0.4.3'
    implementation 'com.makeramen:roundedimageview:2.2.1'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.6.0'
    implementation 'com.xlythe:swap:1.1'
    implementation 'com.xlythe:camera-view:2.0.7'
    constraints {
        implementation('androidx.camera:camera-core:1.4.2') { version { strictly '1.4.2' } }
        implementation('androidx.camera:camera-camera2:1.4.2') { version { strictly '1.4.2' } }
        implementation('androidx.camera:camera-lifecycle:1.4.2') { version { strictly '1.4.2' } }
        implementation('androidx.camera:camera-video:1.4.2') { version { strictly '1.4.2' } }
    }
    implementation 'com.xlythe:message-based-notifications:1.2.2'
    implementation 'com.google.guava:guava:31.1-android'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.robolectric:robolectric:4.14"
}

configurations.all {
    exclude group: 'com.android.support'
    exclude group: 'com.google.guava', module: 'listenablefuture'
}
