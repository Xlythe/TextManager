plugins {
    id 'com.gradleup.nmcp' version '1.5.0'
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'jacoco'
apply plugin: 'signing'

Properties projectProperties = new Properties()
projectProperties.load(rootProject.file('gradle.properties').newDataInputStream())

Properties localProperties = new Properties()
File localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

android {
    compileSdk 37

    defaultConfig {
        minSdk 21
        targetSdk 37
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
    lint {
        abortOnError false
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    namespace 'com.xlythe.textmanager'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = group = projectProperties.getProperty("bintray.groupId")
                artifactId = projectProperties.getProperty("bintray.artifact")
                version = projectProperties.getProperty("bintray.libraryVersion")

                pom {
                    name = projectProperties.getProperty("bintray.libraryName")
                    description = projectProperties.getProperty("bintray.libraryDescription")
                    url = projectProperties.getProperty("bintray.siteUrl")
                    licenses {
                        license {
                            name = projectProperties.getProperty("bintray.licenseName")
                            url = projectProperties.getProperty("bintray.licenseUrl")
                        }
                    }
                    developers {
                        developer {
                            id = projectProperties.getProperty("bintray.developerId")
                            name = projectProperties.getProperty("bintray.developerName")
                            email = projectProperties.getProperty("bintray.developerEmail")
                        }
                    }
                    scm {
                        connection = projectProperties.getProperty("bintray.gitUrl")
                        developerConnection = projectProperties.getProperty("bintray.gitUrl")
                        url = projectProperties.getProperty("bintray.siteUrl")
                    }
                }
            }
        }
    }
}

nmcp {
    publishAllPublicationsToCentralPortal {
        username = localProperties.getProperty("bintray.username")
        password = localProperties.getProperty("bintray.password")
        publishingType = "AUTOMATIC"
    }
}

tasks.named("publish") {
    dependsOn("nmcpPublishAllPublicationsToCentralPortal")
}

signing {
    if (localProperties.getProperty("signing.key") != null) {
        useInMemoryPgpKeys(
                localProperties.getProperty("signing.keyId"),
                localProperties.getProperty("signing.key"),
                localProperties.getProperty("signing.password"),
        )
    }
    sign publishing.publications
}

// Only sign when publishing to Maven Central, so publishToMavenLocal works without signing keys.
gradle.taskGraph.whenReady { graph ->
    boolean remote = graph.hasTask("${project.path}:publish") ||
            graph.hasTask("${project.path}:nmcpPublishAllPublicationsToCentralPortal")
    tasks.withType(Sign).configureEach { enabled = remote }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.work:work-testing:2.10.5'

    implementation 'androidx.work:work-runtime:2.10.5'

    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'com.googlecode.libphonenumber:libphonenumber:9.0.35'
    api 'androidx.legacy:legacy-support-v4:1.0.0'
}
jacoco {
    toolVersion = '0.8.15'
}

def coreSmsClasses = fileTree(
        dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes').get().asFile,
        includes: ['com/xlythe/textmanager/text/sms/**/*.class'])
def coreSmsSources = files('src/main/java')
def unitTestExecutionData = layout.buildDirectory.file('jacoco/testDebugUnitTest.exec').get().asFile

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(coreSmsClasses)
    sourceDirectories.setFrom(coreSmsSources)
    executionData.setFrom(unitTestExecutionData)
    onlyIf {
        unitTestExecutionData.exists() && !coreSmsClasses.isEmpty()
    }
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoTestReport'
    classDirectories.setFrom(coreSmsClasses)
    sourceDirectories.setFrom(coreSmsSources)
    executionData.setFrom(unitTestExecutionData)
    onlyIf {
        unitTestExecutionData.exists() && !coreSmsClasses.isEmpty()
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
